<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main heading -->
    <h1>My Budget Tracker</h1>

    <!-- Description -->
    <p class="intro">
        Track your income and expenses in one place.
    </p>

    <!-- Add Expense Section -->
    <section id="add-expense">
        <h2>Add Expense</h2>

        <label for="expense-name">Expense Name:</label>
        <input
            type="text"
            id="expense-name"
            placeholder="Mango"
        >

        <label for="amount">Amount:</label>
        <input
            type="number"
            id="amount"
            placeholder="1200"
        >

        <label for="category">Category:</label>
        <input
            type="text"
            id="category"
            placeholder="Fruits"
        >
    </section>

    <!-- Your Expenses Section -->
    <section class="expenses-section">
        <h2>Your Expenses</h2>

        <p>My expenses yet</p>
    </section>

</body>
</html>
